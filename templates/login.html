<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stash – Anmelden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-logo">
      <span class="login-logo-icon">💰</span>
      <h1 class="login-title">Stash</h1>
      <p class="login-subtitle">Persönliches Ausgaben-Dashboard</p>
    </div>

    <form class="login-form" method="POST" action="{{ url_for('login') }}">
      {% if error %}
        <div class="alert alert-error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="alert-icon">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ error }}
        </div>
      {% endif %}

      <div class="form-group">
        <label for="password" class="form-label">Passwort</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          placeholder="Dein Passwort eingeben"
          autofocus
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Anmelden
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </form>

    <p class="login-hint">Standard-Passwort: <code>stash</code> (in .env ändern)</p>
  </div>

</body>
</html>
